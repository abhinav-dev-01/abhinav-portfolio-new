<!DOCTYPE html>
<html lang="en" data-theme="cosmos">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Details | ABHINAV.DEV</title>
  <meta name="description" content="Detailed project showcase and technical breakdown — Abhinav's portfolio">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="/style.css">
  <script>
    (function () {
      const savedTheme = localStorage.getItem('abhinav_theme') || 'cosmos';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>

<body>

  <!-- Top Scroll Reading Bar -->
  <div id="scroll-progress-bar" aria-hidden="true"></div>

  <!-- Main Project Page -->
  <main class="project-page-wrap">

    <!-- Header -->
    <div class="project-page-header">
      <a href="/index.html#projects" class="back-btn">
        <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
        <span>BACK TO ALL WORK</span>
      </a>
      <div style="display: flex; align-items: center; gap: 1rem;">
        <button class="mobile-theme-toggle" id="project-theme-toggle" title="Toggle Theme" aria-label="Toggle Theme"
          style="cursor: pointer;">
          <i data-lucide="sun" class="theme-icon-sun" style="width: 18px; height: 18px;"></i>
          <i data-lucide="moon" class="theme-icon-moon" style="width: 18px; height: 18px;"></i>
        </button>
        <span class="project-page-brand">ABHINAV<span>.</span>DEV</span>
      </div>
    </div>

    <!-- Category & Title -->
    <p class="project-detail-category">
      <span class="meta-divider"></span>
      <span id="detail-category">Full-Stack Application</span>
    </p>

    <h1 class="project-detail-title" id="project-title">Loading project...</h1>

    <!-- Cover image -->
    <div class="project-cover-wrap">
      <img id="project-cover" src="/jeevalink.png" alt="Project Cover"
        onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80'">
    </div>

    <!-- Meta row -->
    <div class="project-meta-row">
      <div class="project-meta-block">
        <h4>TECHNOLOGIES USED</h4>
        <div id="project-skills" class="project-tech-list"></div>
      </div>
      <div class="project-meta-block">
        <h4>SYSTEM TYPE</h4>
        <p id="project-type" style="font-family: var(--font-mono); font-size: 0.85rem; color: var(--text-2);">—</p>
      </div>
    </div>

    <!-- Abstract -->
    <p class="project-abstract" id="project-abstract">Loading system description...</p>

    <!-- Links -->
    <div class="project-links-row">
      <a href="#" id="project-live-link" target="_blank" class="project-link-btn primary">
        <span>LAUNCH LIVE DEMO</span>
        <i data-lucide="external-link" style="width: 15px; height: 15px;"></i>
      </a>
      <a href="#" id="project-github-link" target="_blank" class="project-link-btn secondary">
        <i data-lucide="github" style="width: 15px; height: 15px;"></i>
        <span>VIEW REPOSITORY</span>
      </a>
    </div>

  </main>

  <!-- Back To Top Floating Button -->
  <button id="back-to-top" aria-label="Back to top">
    <i data-lucide="arrow-up" style="width: 18px; height: 18px;"></i>
  </button>

  <div class="toast-container" id="toast-container"></div>

  <script type="module" src="/project.js"></script>
</body>

</html>
